services:
  ducky-squacky:
    build:
      context: .
      dockerfile: Dockerfile
    # HTTPS is provided by the existing home-proxy Dockge stack.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
